<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Roteiros de gravação do Caçulinha para 6 de outubro de 2026.">
  <title>Roteiros de Gravação | Caçulinha</title>
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='16' fill='%230f6b42'/%3E%3Cpath d='M42 17c-4-4-10-6-16-3C15 19 11 35 18 45c5 7 16 8 24 2' fill='none' stroke='white' stroke-width='7' stroke-linecap='round'/%3E%3Cpath d='M40 24c-3-3-8-4-12-1-5 4-6 12-2 16' fill='none' stroke='%23dc3035' stroke-width='5' stroke-linecap='round'/%3E%3C/svg%3E">
  <style>
    :root {
      color-scheme: light;
      --brand: #0d6b42;
      --brand-strong: #084c30;
      --brand-soft: #e9f5ef;
      --red: #d93339;
      --ink: #183029;
      --muted: #60736c;
      --surface: #ffffff;
      --canvas: #f3f7f5;
      --line: #dce7e1;
      --warning: #fff7e5;
      --warning-line: #e9b949;
      --radius: 18px;
      --shadow: 0 14px 34px rgba(19, 64, 46, .08);
    }
    * { box-sizing: border-box; }
    html { scroll-behavior: smooth; scroll-padding-top: 88px; }
    body {
      margin: 0;
      background: var(--canvas);
      color: var(--ink);
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      font-size: 16px;
      line-height: 1.62;
    }
    button, input { font: inherit; }
    button { color: inherit; }
    a { color: inherit; }
    .sr-only { position: absolute !important; width: 1px !important; height: 1px !important; padding: 0 !important; margin: -1px !important; overflow: hidden !important; clip: rect(0,0,0,0) !important; white-space: nowrap !important; border: 0 !important; }
    :focus-visible { outline: 3px solid rgba(13,107,66,.28); outline-offset: 3px; }
    .skip-link { position: fixed; left: 16px; top: -80px; z-index: 100; background: var(--brand); color: white; padding: 10px 14px; border-radius: 10px; }
    .skip-link:focus { top: 12px; }
    .topbar {
      position: sticky; top: 0; z-index: 30;
      display: flex; align-items: center; gap: 16px;
      min-height: 72px; padding: 10px clamp(16px, 4vw, 48px);
      background: rgba(255,255,255,.94); border-bottom: 1px solid var(--line);
      backdrop-filter: blur(16px);
    }
    .brand { display: flex; align-items: center; gap: 14px; min-width: 0; }
    .brand img { width: 150px; max-height: 48px; object-fit: contain; object-position: left center; }
    .brand-copy { display: grid; gap: 1px; }
    .brand-copy strong { font-size: .98rem; line-height: 1.25; }
    .brand-copy span { color: var(--muted); font-size: .78rem; }
    .top-actions { margin-left: auto; display: flex; gap: 10px; align-items: center; min-width: 0; }
    .search { position: relative; width: min(360px, 34vw); min-width: 0; }
    .search svg { position: absolute; left: 13px; top: 50%; transform: translateY(-50%); width: 18px; color: var(--muted); }
    .search input { width: 100%; min-width: 0; height: 42px; padding: 0 40px; border: 1px solid var(--line); border-radius: 12px; background: #f9fbfa; color: var(--ink); }
    .search input::placeholder { color: #7b8d86; }
    .clear-search { position: absolute; right: 8px; top: 50%; transform: translateY(-50%); border: 0; background: transparent; cursor: pointer; padding: 6px; color: var(--muted); display: none; }
    .icon-button, .ghost-button, .copy-button {
      border: 1px solid var(--line); background: white; border-radius: 11px; min-height: 42px; padding: 8px 12px; cursor: pointer;
    }
    .icon-button { display: none; width: 42px; padding: 0; }
    .ghost-button:hover, .copy-button:hover, .icon-button:hover { border-color: #a9c6b8; background: var(--brand-soft); }
    .layout { max-width: 1480px; margin: 0 auto; padding: 28px clamp(16px, 3vw, 40px) 70px; display: grid; grid-template-columns: 270px minmax(0, 1fr); gap: 28px; align-items: start; }
    .sidebar { position: sticky; top: 96px; max-height: calc(100vh - 120px); overflow: auto; background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); padding: 16px; box-shadow: var(--shadow); }
    .sidebar-label { margin: 4px 8px 10px; color: var(--muted); font-size: .76rem; font-weight: 800; letter-spacing: .1em; text-transform: uppercase; }
    .nav-list { list-style: none; margin: 0; padding: 0; display: grid; gap: 4px; }
    .nav-list a { display: flex; gap: 10px; align-items: center; padding: 9px 10px; border-radius: 10px; text-decoration: none; color: #40544d; font-size: .9rem; line-height: 1.3; }
    .nav-list a:hover, .nav-list a.active { background: var(--brand-soft); color: var(--brand-strong); font-weight: 750; }
    .nav-number { flex: 0 0 auto; width: 26px; height: 26px; display: grid; place-items: center; border-radius: 8px; color: var(--brand); background: #edf7f2; font-weight: 800; font-size: .74rem; }
    .progress-card { margin-top: 16px; padding: 14px; background: #f7faf8; border: 1px solid var(--line); border-radius: 12px; }
    .progress-row { display: flex; justify-content: space-between; gap: 12px; font-size: .78rem; color: var(--muted); }
    .progress-track { height: 7px; background: #dfe9e4; border-radius: 999px; overflow: hidden; margin-top: 9px; }
    .progress-fill { width: 0; height: 100%; background: linear-gradient(90deg, var(--brand), #24a069); transition: width .25s ease; }
    .content { min-width: 0; display: grid; grid-template-columns: minmax(0, 1fr); gap: 22px; }
    .hero, .section-card { background: var(--surface); border: 1px solid var(--line); border-radius: 24px; box-shadow: var(--shadow); }
    .hero { overflow: hidden; position: relative; padding: clamp(24px, 5vw, 54px); }
    .hero::after { content: ""; position: absolute; right: -85px; top: -105px; width: 260px; height: 260px; border-radius: 50%; background: radial-gradient(circle, rgba(13,107,66,.15), rgba(13,107,66,0) 68%); pointer-events: none; }
    .eyebrow { color: var(--red); font-size: .78rem; letter-spacing: .14em; text-transform: uppercase; font-weight: 850; }
    .hero h1 { max-width: 760px; margin: 8px 0 12px; font-size: clamp(2rem, 5vw, 4.25rem); line-height: 1.02; letter-spacing: -.045em; }
    .hero .subtitle { color: var(--brand); font-weight: 800; font-size: clamp(1rem, 2vw, 1.22rem); text-transform: uppercase; letter-spacing: .04em; }
    .hero .intro { max-width: 760px; margin: 18px 0 0; color: var(--muted); font-size: 1.06rem; }
    .metrics { display: grid; grid-template-columns: repeat(3, minmax(0,1fr)); gap: 12px; margin-top: 28px; }
    .metric { background: #f7faf8; border: 1px solid var(--line); border-radius: 14px; padding: 16px; }
    .metric strong { display: block; color: var(--brand-strong); font-size: 1.55rem; line-height: 1.1; }
    .metric span { color: var(--muted); font-size: .82rem; }
    .priority-note { margin: 20px 0 0; padding-left: 14px; border-left: 3px solid var(--red); color: #4e625a; font-style: italic; }
    .section-card { padding: clamp(22px, 4vw, 40px); }
    .section-card[hidden] { display: none; }
    .section-heading { display: flex; gap: 18px; align-items: flex-start; justify-content: space-between; margin-bottom: 22px; }
    .section-kicker { display: block; margin-bottom: 5px; color: var(--red); font-size: .75rem; font-weight: 850; letter-spacing: .12em; text-transform: uppercase; }
    .section-heading h2 { margin: 0; font-size: clamp(1.55rem, 3vw, 2.3rem); line-height: 1.12; letter-spacing: -.025em; }
    .section-body > :first-child { margin-top: 0; }
    .section-body > :last-child { margin-bottom: 0; }
    h3 { margin: 30px 0 10px; color: var(--brand-strong); font-size: 1.12rem; line-height: 1.3; }
    p { margin: 10px 0; }
    ul, ol { margin: 10px 0 18px; padding-left: 1.35rem; }
    li { margin: 7px 0; padding-left: 4px; }
    .detail-line { margin: 8px 0; color: #40544d; }
    .detail-line strong { color: var(--ink); }
    .spoken { margin: 10px 0; padding: 14px 16px; background: #f7faf8; border-left: 3px solid #98c7ae; border-radius: 0 12px 12px 0; }
    .spoken strong { display: block; color: var(--brand-strong); margin-bottom: 4px; }
    .spoken em { color: #2f463e; }
    .callout { margin: 18px 0; padding: 18px 20px; border: 1px solid #ebddb8; border-left: 4px solid var(--warning-line); border-radius: 14px; background: var(--warning); white-space: pre-line; }
    .callout strong { display: block; margin-bottom: 4px; color: #6c4c05; font-size: .78rem; letter-spacing: .08em; text-transform: uppercase; }
    .table-wrap { margin: 16px 0 24px; overflow-x: auto; border: 1px solid var(--line); border-radius: 14px; }
    table { width: 100%; border-collapse: collapse; min-width: 620px; font-size: .91rem; }
    th { text-align: left; background: var(--brand); color: white; padding: 12px 14px; font-size: .78rem; letter-spacing: .04em; text-transform: uppercase; }
    td { padding: 12px 14px; border-top: 1px solid var(--line); vertical-align: top; }
    tbody tr:nth-child(even) { background: #f8fbf9; }
    .take-list { display: grid; gap: 8px; margin: 12px 0 22px; }
    .check-item { display: flex; gap: 12px; align-items: flex-start; padding: 12px 14px; border: 1px solid var(--line); border-radius: 12px; background: #fbfdfc; cursor: pointer; }
    .check-item:hover { border-color: #aecbbd; }
    .check-item input { flex: 0 0 auto; width: 19px; height: 19px; margin-top: 3px; accent-color: var(--brand); }
    .check-item:has(input:checked) { background: var(--brand-soft); color: #496159; }
    .check-item:has(input:checked) span { text-decoration: line-through; text-decoration-thickness: 1.5px; }
    .check-number { color: var(--brand); font-weight: 800; min-width: 24px; }
    .copy-button { flex: 0 0 auto; display: inline-flex; align-items: center; gap: 7px; font-size: .84rem; color: var(--brand-strong); }
    .copy-button svg { width: 16px; }
    .empty-state { display: none; text-align: center; padding: 44px 22px; background: white; border: 1px dashed #afc7bc; border-radius: 20px; color: var(--muted); }
    .empty-state.visible { display: block; }
    .back-top { position: fixed; right: 22px; bottom: 22px; z-index: 20; width: 44px; height: 44px; border: 0; border-radius: 50%; color: white; background: var(--brand); box-shadow: 0 12px 24px rgba(13,107,66,.26); cursor: pointer; opacity: 0; transform: translateY(10px); pointer-events: none; transition: .2s ease; }
    .back-top.visible { opacity: 1; transform: none; pointer-events: auto; }
    .toast { position: fixed; left: 50%; bottom: 28px; z-index: 50; transform: translate(-50%, 20px); background: #183029; color: white; padding: 10px 15px; border-radius: 10px; opacity: 0; pointer-events: none; transition: .2s ease; }
    .toast.visible { opacity: 1; transform: translate(-50%, 0); }
    .mobile-backdrop { display: none; }
    @media (max-width: 960px) {
      .brand img { width: 122px; }
      .brand-copy { display: none; }
      .layout { grid-template-columns: 1fr; }
      .sidebar { position: fixed; z-index: 45; left: 14px; top: 84px; bottom: 14px; width: min(320px, calc(100vw - 28px)); max-height: none; transform: translateX(calc(-100% - 28px)); transition: transform .24s ease; }
      body.nav-open .sidebar { transform: none; }
      .mobile-backdrop { position: fixed; inset: 0; z-index: 40; background: rgba(12,35,27,.34); }
      body.nav-open .mobile-backdrop { display: block; }
      .icon-button { display: grid; place-items: center; }
      .search { width: min(380px, 48vw); }
    }
    @media (max-width: 640px) {
      .topbar { gap: 10px; }
      .brand { flex: 0 0 84px; }
      .brand img { width: 84px; }
      .search { width: auto; flex: 1 1 0; min-width: 0; }
      .search input { padding-left: 36px; }
      .top-actions { margin-left: 0; flex: 1; }
      .ghost-button { display: none; }
      .layout { padding: 16px 12px 56px; }
      .hero, .section-card { border-radius: 18px; }
      .hero { padding: 25px 20px; }
      .metrics { grid-template-columns: 1fr; }
      .section-card { padding: 22px 18px; }
      .section-heading { display: grid; }
      .copy-button { width: max-content; }
      .table-wrap { margin-left: -4px; margin-right: -4px; }
      .back-top { right: 14px; bottom: 14px; }
    }
    @media print {
      body { background: white; }
      .topbar, .sidebar, .back-top, .toast, .copy-button, .empty-state { display: none !important; }
      .layout { display: block; max-width: none; padding: 0; }
      .hero, .section-card { box-shadow: none; border: 0; padding: 18px 0; break-inside: avoid-page; }
      .section-card[hidden] { display: block; }
      .check-item { break-inside: avoid; }
    }
  </style>
</head>

aragraph", "text": "Rafael: “Vai comprar carne e sempre fica com medo de faltar ou de levar muito mais do que precisa? Então salva essa referência.”", "style": "Normal", "runs": [{"text": "Rafael: ", "bold": true, "italic": false, "underline": false}, {"text": "“Vai comprar carne e sempre fica com medo de faltar ou de levar muito mais do que precisa? Então salva essa referência.”", "bold": false, "italic": true, "underline": false}]}, {"type": "paragraph", "text": "Rafael: “Para uma refeição comum, você pode calcular entre duzentos e duzentos e cinquenta gramas de carne sem osso por adulto.”", "style": "Normal", "runs": [{"text": "Rafael: ", "bold": true, "italic": false, "underline": false}, {"text": "“Para uma refeição comum, você pode calcular entre duzentos e duzentos e cinquenta gramas de carne sem osso por adulto.”", "bold": false, "italic": true, "underline": false}]}, {"type": "paragraph", "text": "Rafael: “Agora, se a ideia é fazer um churrasco, a conta costuma ficar entre trezentos e cinquenta e quatrocentos e cinquenta gramas por adulto.”", "style": "Normal", "runs": [{"text": "Rafael: ", "bold": true, "italic": false, "underline": false}, {"text": "“Agora, se a ideia é fazer um churrasco, a conta costuma ficar entre trezentos e cinquenta e quatrocentos e cinquenta gramas por adulto.”", "bold": false, "italic": true, "underline": false}]}, {"type": "paragraph", "text": "Rafael: “Se tiver bastante acompanhamento, como arroz, farofa, pão de alho, vinagrete e salada, você pode trabalhar mais perto da faixa menor.”", "style": "Normal", "runs": [{"text": "Rafael: ", "bold": true, "italic": false, "underline": false}, {"text": "“Se tiver bastante acompanhamento, como arroz, farofa, pão de alho, vinagrete e salada, você pode trabalhar mais perto da faixa menor.”", "bold": false, "italic": true, "underline": false}]}, {"type": "paragraph", "text": "Rafael: “Para as crianças, uma boa referência é calcular aproximadamente metade da quantidade de um adulto.”", "style": "Normal", "runs": [{"text": "Rafael: ", "bold": true, "italic": false, "underline": false}, {"text": "“Para as crianças, uma boa referência é calcular aproximadamente metade da quantidade de um adulto.”", "bold": false, "italic": true, "underline": false}]}, {"type": "paragraph", "text": "Rafael: “E atenção: se você escolher cortes com osso, precisa considerar um pouco mais de peso na compra.”", "style": "Normal", "runs": [{"text": "Rafael: ", "bold": true, "italic": false, "underline": false}, {"text": "“E atenção: se você escolher cortes com osso, precisa considerar um pouco mais de peso na compra.”", "bold": false, "italic": true, "underline": false}]}, {"type": "paragraph", "text": "Rafael: “Essas quantidades são uma base e podem mudar conforme o perfil dos convidados e o cardápio. Se ainda ficar em dúvida, fala com a nossa equipe. No Caçulinha, a gente ajuda você a levar a quantidade certa.”", "style": "Normal", "runs": [{"text": "Rafael: ", "bold": true, "italic": false, "underline": false}, {"text": "“Essas quantidades são uma base e podem mudar conforme o perfil dos convidados e o cardápio. Se ainda ficar em dúvida, fala com a nossa equipe. No Caçulinha, a gente ajuda você a levar a quantidade certa.”", "bold": false, "italic": true, "underline": false}]}, {"type": "paragraph", "text": "Orientação de gravação", "style": "Heading 2", "runs": [{"text": "Orientação de gravação", "bold": false, "italic": false, "underline": false}]}, {"type": "paragraph", "text": "Rafael pode segurar uma bandeja ou ficar ao lado do balcão de carnes.", "style": "List Bullet", "runs": [{"text": "Rafael pode segurar uma bandeja ou ficar ao lado do balcão de carnes.", "bold": false, "italic": false, "underline": false}]}, {"type": "paragraph", "text": "Falar os números com calma para que sejam facilmente compreendidos.", "style": "List Bullet", "runs": [{"text": "Falar os números com calma para que sejam facilmente compreendidos.", "bold": false, "italic": false, "underline": false}]}, {"type": "paragraph", "text": "Não apresentar as quantidades como regra absoluta; reforçar que são referências.", "style": "List Bullet", "runs": [{"text": "Não apresentar as quantidades como regra absoluta; reforçar que são referências.", "bold": false, "italic": false, "underline": false}]}, {"type": "paragraph", "text": "Separar alguns acompanhamentos para ilustrar visualmente a diferença entre os cenários.", "style": "List Bullet", "runs": [{"text": "Separar alguns acompanhamentos para ilustrar visualmente a diferença entre os cenários.", "bold": false, "italic": false, "underline": false}]}, {"type": "paragraph", "text": "Takes específicos", "style": "Heading 2", "runs": [{"text": "Takes específicos", "bold": false, "italic": false, "underline": false}]}, {"type": "table", "rows": [["#", "Take necessário"], ["1", "Rafael falando ao lado da vitrine de carnes."], ["2", "Carne sendo colocada na balança."], ["3", "Visor da balança chegando próximo de 250 g, sem necessidade de mostrar preço."], ["4", "Visor da balança chegando próximo de 400 g."], ["5", "Cortes com e sem osso apresentados separadamente."], ["6", "Acompanhamentos de churrasco reunidos próximos à carne."]]}, {"type": "paragraph", "text": "ROTEIRO 04  •  SÉRIE DE VÍDEOS CURTOS", "style": "Normal", "runs": [{"text": "ROTEIRO 04  •  SÉRIE DE VÍDEOS CURTOS", "bold": true, "italic": false, "underline": false}]}, {"type": "paragraph", "text": "Pergunte ao açougueiro", "style": "Heading 1", "runs": [{"text": "Pergunte ao açougueiro", "bold": false, "italic": false, "underline": false}]}, {"type": "paragraph", "text": "Objetivo: Criar uma série recorrente de respostas rápidas, aproveitando o conhecimento da equipe e as dúvidas reais dos clientes.", "style": "Normal", "runs": [{"text": "Objetivo: ", "bold": true, "italic": false, "underline": false}, {"text": "Criar uma série recorrente de respostas rápidas, aproveitando o conhecimento da equipe e as dúvidas reais dos clientes.", "bold": false, "italic": false, "underline": false}]}, {"type": "paragraph", "text": "Participação: Rafael fazendo as perguntas para um açougueiro ou o próprio Rafael respondendo diretamente.", "style": "Normal", "runs": [{"text": "Participação: ", "bold": true, "italic": false, "underline": false}, {"text": "Rafael fazendo as perguntas para um açougueiro ou o próprio Rafael respondendo diretamente.", "bold": false, "italic": false, "underline": false}]}, {"type": "paragraph", "text": "Estratégia: Gravar cada pergunta como um vídeo independente. Assim, uma única captação pode render vários conteúdos.", "style": "Normal", "runs": [{"text": "Estratégia: ", "bold": true, "italic": false, "underline": false}, {"text": "Gravar cada pergunta como um vídeo independente. Assim, uma única captação pode render vários conteúdos.", "bold": false, "italic": false, "underline": false}]}, {"type": "paragraph", "text": "Abertura padrão", "style": "Heading 2", "runs": [{"text": "Abertura padrão", "bold": false, "italic": false, "underline": false}]}, {"type": "paragraph", "text": "Rafael: “Tem dúvida na hora de escolher carne? Então pergunta para quem entende. Hoje a pergunta é a seguinte:”", "style": "Normal", "runs": [{"text": "Rafael: ", "bold": true, "italic": false, "underline": false}, {"text": "“Tem dúvida na hora de escolher carne? Então pergunta para quem entende. Hoje a pergunta é a seguinte:”", "bold": false, "italic": true, "underline": false}]}, {"type": "paragraph", "text": "1. Qual carne escolher para fazer na panela?", "style": "Heading 3", "runs": [{"text": "1. Qual carne escolher para fazer na panela?", "bold": false, "italic": false, "underline": false}]}, {"type": "paragraph", "text": "Resposta sugerida: “Para panela, você pode usar cortes como acém, músculo, paleta ou peito. O mais importante é escolher um corte que combine com o tempo de cozimento e com o resultado que você quer.”", "style": "Normal", "runs": [{"text": "Resposta sugerida: ", "bold": true, "italic": false, "underline": false}, {"text": "“Para panela, você pode usar cortes como acém, músculo, paleta ou peito. O mais importante é escolher um corte que combine com o tempo de cozimento e com o resultado que você quer.”", "bold": false, "italic": true, "underline": false}]}, {"type": "paragraph", "text": "2. Quais cortes funcionam bem para bife?", "style": "Heading 3", "runs": [{"text": "2. Quais cortes funcionam bem para bife?", "bold": false, "italic": false, "underline": false}]}, {"type": "paragraph", "text": "Resposta sugerida: “Contrafilé, alcatra, patinho e coxão mole são algumas opções. Mas espessura, corte correto e preparo também fazem diferença no resultado.”", "style": "Normal", "runs": [{"text": "Resposta sugerida: ", "bold": true, "italic": false, "underline": false}, {"text": "“Contrafilé, alcatra, patinho e coxão mole são algumas opções. Mas espessura, corte correto e preparo também fazem diferença no resultado.”", "bold": false, "italic": true, "underline": false}]}, {"type": "paragraph", "text": "3. Como calcular a quantidade para a família?", "style": "Heading 3", "runs": [{"text": "3. Como calcular a quantidade para a família?", "bold": false, "italic": false, "underline": false}]}, {"type": "paragraph", "text": "Resposta sugerida: “Para uma refeição comum, use de duzentos a duzentos e cinquenta gramas de carne sem osso por adulto como referência. Depois ajuste conforme os acompanhamentos e o perfil de quem vai comer.”", "style": "Normal", "runs": [{"text": "Resposta sugerida: ", "bold": true, "italic": false, "underline": false}, {"text": "“Para uma refeição comum, use de duzentos a duzentos e cinquenta gramas de carne sem osso por adulto como referência. Depois ajuste conforme os acompanhamentos e o perfil de quem vai comer.”", "bold": false, "italic": true, "underline": false}]}, {"type": "paragraph", "text": "4. É melhor congelar a carne inteira ou porcionada?", "style": "Heading 3", "runs": [{"text": "4. É melhor congelar a carne inteira ou porcionada?", "bold": false, "italic": false, "underline": false}]}, {"type": "paragraph", "text": "Resposta sugerida: “Para facilitar a rotina, o ideal é separar nas quantidades que serão usadas em cada refeição. Embale bem, identifique e congele as porções individualmente.”", "style": "Normal", "runs": [{"text": "Resposta sugerida: ", "bold": true, "italic": false, "underline": false}, {"text": "“Para facilitar a rotina, o ideal é separar nas quantidades que serão usadas em cada refeição. Embale bem, identifique e congele as porções individualmente.”", "bold": false, "italic": true, "underline": false}]}, {"type": "paragraph", "text": "5. Qual é a melhor maneira de descongelar?", "style": "Heading 3", "runs": [{"text": "5. Qual é a melhor maneira de descongelar?", "bold": false, "italic": false, "underline": false}]}, {"type": "paragraph", "text": "Resposta sugerida: “O mais seguro é planejar com antecedência e deixar a carne descongelando dentro da geladeira. Evite deixar em temperatura ambiente.”", "style": "Normal", "runs": [{"text": "Resposta sugerida: ", "bold": true, "italic": false, "underline": false}, {"text": "“O mais seguro é planejar com antecedência e deixar a carne descongelando dentro da geladeira. Evite deixar em temperatura ambiente.”", "bold": false, "italic": true, "underline": false}]}, {"type": "paragraph", "text": "6. Posso pedir para cortar e porcionar?", "style": "Heading 3", "runs": [{"text": "6. Posso pedir para cortar e porcionar?", "bold": false, "italic": false, "underline": false}]}, {"type": "paragraph", "text": "Resposta sugerida: “Converse com a nossa equipe e explique como você pretende preparar. Sempre que a operação permitir, a gente ajuda com o corte e com o porcionamento mais adequado.”", "style": "Normal", "runs": [{"text": "Resposta sugerida: ", "bold": true, "italic": false, "underline": false}, {"text": "“Converse com a nossa equipe e explique como você pretende preparar. Sempre que a operação permitir, a gente ajuda com o corte e com o porcionamento mais adequado.”", "bold": false, "italic": true, "underline": false}]}, {"type": "paragraph", "text": "Encerramento padrão", "style": "Heading 2", "runs": [{"text": "Encerramento padrão", "bold": false, "italic": false, "underline": false}]}, {"type": "paragraph", "text": "Rafael: “Tem outra dúvida? Deixa nos comentários. E quando vier à loja, pode perguntar também: no Caçulinha, a gente ajuda você a escolher.”", "style": "Normal", "runs": [{"text": "Rafael: ", "bold": true, "italic": false, "underline": false}, {"text": "“Tem outra dúvida? Deixa nos comentários. E quando vier à loja, pode perguntar também: no Caçulinha, a gente ajuda você a escolher.”", "bold": false, "italic": true, "underline": false}]}, {"type": "paragraph", "text": "Orientação de gravação", "style": "Heading 2", "runs": [{"text": "Orientação de gravação", "bold": false, "italic": false, "underline": false}]}, {"type": "paragraph", "text": "Gravar todas as perguntas na mesma posição para criar uma identidade de série.", "style": "List Bullet", "runs": [{"text": "Gravar todas as perguntas na mesma posição para criar uma identidade de série.", "bold": false, "italic": false, "underline": false}]}, {"type": "paragraph", "text": "Cada resposta deve ficar direta e natural, sem parecer uma aula técnica.", "style": "List Bullet", "runs": [{"text": "Cada resposta deve ficar direta e natural, sem parecer uma aula técnica.", "bold": false, "italic": false, "underline": false}]}, {"type": "paragraph", "text": "Se o açougueiro responder, Rafael fica fora do quadro fazendo a pergunta ou aparece ao lado dele.", "style": "List Bullet", "runs": [{"text": "Se o açougueiro responder, Rafael fica fora do quadro fazendo a pergunta ou aparece ao lado dele.", "bold": false, "italic": false, "underline": false}]}, {"type": "paragraph", "text": "Antes de cada nova pergunta, pausar alguns segundos para facilitar a separação dos arquivos.", "style": "List Bullet", "runs": [{"text": "Antes de cada nova pergunta, pausar alguns segundos para facilitar a separação dos arquivos.", "bold": false, "italic": false, "underline": false}]}, {"type": "paragraph", "text": "Takes específicos", "style": "Heading 2", "runs": [{"text": "Takes específicos", "bold": false, "italic": false, "underline": false}]}, {"type": "table", "rows": [["#", "Take necessário"], ["1", "Rafael fazendo cada pergunta olhando para o açougueiro."], ["2", "Açougueiro respondendo atrás do balcão."], ["3", "Cada corte citado sendo mostrado individualmente."], ["4", "Carne sendo porcionada e embalada."], ["5", "Etiqueta sendo colocada na embalagem."], ["6", "Pacote sendo entregue pelo balcão."]]}, {"type": "paragraph", "text": "ROTEIRO 05  •  CONTEÚDO DE UTILIDADE", "style": "Normal", "runs": [{"text": "ROTEIRO 05  •  CONTEÚDO DE UTILIDADE", "bold": true, "italic": false, "underline": false}]}, {"type": "paragraph", "text": "Três soluções para quem não sabe o que preparar hoje", "style": "Heading 1", "runs": [{"text": "Três soluções para quem não sabe o que preparar hoje", "bold": false, "italic": false, "underline": false}]}, {"type": "paragraph", "text": "Objetivo: Transformar a dúvida sobre o almoço ou jantar em três sugestões simples, mostrando como o Caçulinha ajuda o cliente a decidir.", "style": "Normal", "runs": [{"text": "Objetivo: ", "bold": true, "italic": false, "underline": false}, {"text": "Transformar a dúvida sobre o almoço ou jantar em três sugestões simples, mostrando como o Caçulinha ajuda o cliente a decidir.", "bold": false, "italic": false, "underline": false}]}, {"type": "paragraph", "text": "Participação: Rafael.", "style": "Normal", "runs": [{"text": "Participação: ", "bold": true, "italic": false, "underline": false}, {"text": "Rafael.", "bold": false, "italic": false, "underline": false}]}, {"type": "paragraph", "text": "Preparação: Separar um corte adequado para cada sugestão antes de começar a gravar.", "style": "Normal", "runs": [{"text": "Preparação: ", "bold": true, "italic": false, "underline": false}, {"text": "Separar um corte adequado para cada sugestão antes de começar a gravar.", "bold": false, "italic": false, "underline": false}]}, {"type": "paragraph", "text": "Roteiro falado", "style": "Heading 2", "runs": [{"text": "Roteiro falado", "bold": false, "italic": false, "underline": false}]}, {"type": "paragraph", "text": "Rafael: “Abriu a geladeira, não teve nenhuma ideia e ainda não sabe o que preparar hoje? Eu vou te dar três opções.”", "style": "Normal", "runs": [{"text": "Rafael: ", "bold": true, "italic": false, "underline": false}, {"text": "“Abriu a geladeira, não teve nenhuma ideia e ainda não sabe o que preparar hoje? Eu vou te dar três opções.”", "bold": false, "italic": true, "underline": false}]}, {"type": "paragraph", "text": "Rafael: “Primeira: bife acebolado, com arroz, feijão e uma salada. É simples, rápido e resolve muito bem o almoço do dia a dia.”", "style": "Normal", "runs": [{"text": "Rafael: ", "bold": true, "italic": false, "underline": false}, {"text": "“Primeira: bife acebolado, com arroz, feijão e uma salada. É simples, rápido e resolve muito bem o almoço do dia a dia.”", "bold": false, "italic": true, "underline": false}]}, {"type": "paragraph", "text": "Rafael: “Segunda: carne de panela com batata e legumes. Uma opção cheia de sabor e que ainda rende uma refeição bem completa.”", "style": "Normal", "runs": [{"text": "Rafael: ", "bold": true, "italic": false, "underline": false}, {"text": "“Segunda: carne de panela com batata e legumes. Uma opção cheia de sabor e que ainda rende uma refeição bem completa.”", "bold": false, "italic": true, "underline": false}]}, {"type": "paragraph", "text": "Rafael: “Terceira: carne assada com batatas e os acompanhamentos que você preferir. Perfeita para quando você quer preparar algo especial sem complicar.”", "style": "Normal", "runs": [{"text": "Rafael: ", "bold": true, "italic": false, "underline": false}, {"text": "“Terceira: carne assada com batatas e os acompanhamentos que você preferir. Perfeita para quando você quer preparar algo especial sem complicar.”", "bold": false, "italic": true, "underline": false}]}, {"type": "paragraph", "text": "Rafael: “Já escolheu qual delas vai fazer? Se ainda estiver na dúvida, vem pro Caçulinha que a gente ajuda você a decidir e escolher o corte certo.”", "style": "Normal", "runs": [{"text": "Rafael: ", "bold": true, "italic": false, "underline": false}, {"text": "“Já escolheu qual delas vai fazer? Se ainda estiver na dúvida, vem pro Caçulinha que a gente ajuda você a decidir e escolher o corte certo.”", "bold": false, "italic": true, "underline": false}]}, {"type": "paragraph", "text": "Orientação de gravação", "style": "Heading 2", "runs": [{"text": "Orientação de gravação", "bold": false, "italic": false, "underline": false}]}, {"type": "paragraph", "text": "Separar os três cortes em bandejas diferentes e apresentá-los na ordem da fala.", "style": "List Bullet", "runs": [{"text": "Separar os três cortes em bandejas diferentes e apresentá-los na ordem da fala.", "bold": false, "italic": false, "underline": false}]}, {"type": "paragraph", "text": "Rafael pode mudar levemente de posição a cada sugestão para deixar o vídeo mais dinâmico.", "style": "List Bullet", "runs": [{"text": "Rafael pode mudar levemente de posição a cada sugestão para deixar o vídeo mais dinâmico.", "bold": false, "italic": false, "underline": false}]}, {"type": "paragraph", "text": "Se houver ingredientes complementares disponíveis, deixá-los próximos do respectivo corte.", "style": "List Bullet", "runs": [{"text": "Se houver ingredientes complementares disponíveis, deixá-los próximos do respectivo corte.", "bold": false, "italic": false, "underline": false}]}, {"type": "paragraph", "text": "Não precisa preparar os pratos durante a gravação; o foco é a indicação e a escolha do produto.", "style": "List Bullet", "runs": [{"text": "Não precisa preparar os pratos durante a gravação; o foco é a indicação e a escolha do produto.", "bold": false, "italic": false, "underline": false}]}, {"type": "paragraph", "text": "Takes específicos", "style": "Heading 2", "runs": [{"text": "Takes específicos", "bold": false, "italic": false, "underline": false}]}, {"type": "table", "rows": [["#", "Take necessário"], ["1", "Rafael com os três cortes organizados à sua frente."], ["2", "Close no corte indicado para bife."], ["3", "Close no corte indicado para carne de panela."], ["4", "Close no corte indicado para assar."], ["5", "Rafael apontando ou pegando cada opção enquanto explica."], ["6", "Os três produtos reunidos no encerramento."]]}, {"type": "paragraph", "text": "ROTEIRO 06  •  CONTEÚDO COMERCIAL", "style": "Normal", "runs": [{"text": "ROTEIRO 06  •  CONTEÚDO COMERCIAL", "bold": true, "italic": false, "underline": false}]}, {"type": "paragraph", "text": "Kits de churrasco", "style": "Heading 1", "runs": [{"text": "Kits de churrasco", "bold": false, "italic": false, "underline": false}]}, {"type": "paragraph", "text": "Objetivo: Apresentar as três opções de kits, facilitar a escolha e estimular pedidos para retirada ou delivery.", "style": "Normal", "runs": [{"text": "Objetivo: ", "bold": true, "italic": false, "underline": false}, {"text": "Apresentar as três opções de kits, facilitar a escolha e estimular pedidos para retirada ou delivery.", "bold": false, "italic": false, "underline": false}]}, {"type": "paragraph", "text": "Participação: Rafael.", "style": "Normal", "runs": [{"text": "Participação: ", "bold": true, "italic": false, "underline": false}, {"text": "Rafael.", "bold": false, "italic": false, "underline": false}]}, {"type": "paragraph", "text": "Tom: Conversa direta, com energia de fim de semana e foco em praticidade.", "style": "Normal", "runs": [{"text": "Tom: ", "bold": true, "italic": false, "underline": false}, {"text": "Conversa direta, com energia de fim de semana e foco em praticidade.", "bold": false, "italic": false, "underline": false}]}, {"type": "table", "rows": [["CONFERÊNCIA OBRIGATÓRIA\nAntes de gravar, confirmar se valores, composição, rendimento e disponibilidade continuam exatamente como descritos abaixo."]]}, {"type": "paragraph", "text": "Roteiro falado", "style": "Heading 2", "runs": [{"text": "Roteiro falado", "bold": false, "italic": false, "underline": false}]}, {"type": "paragraph", "text": "Rafael: “Fim de semana não tem jeito: é dia de churrasco! E se você gosta de praticidade ou não tem tempo de sair comprando tudo separado, o Caçulinha ajuda você.”", "style": "Normal", "runs": [{"text": "Rafael: ", "bold": true, "italic": false, "underline": false}, {"text": "“Fim de semana não tem jeito: é dia de churrasco! E se você gosta de praticidade ou não tem tempo de sair comprando tudo separado, o Caçulinha ajuda você.”", "bold": false, "italic": true, "underline": false}]}, {"type": "paragraph", "text": "Rafael: “Nós preparamos três opções de kits prontinhos, com carne, linguiça, asa de frango, pão de alho e carvão para você só escolher o tamanho da resenha.”", "style": "Normal", "runs": [{"text": "Rafael: ", "bold": true, "italic": false, "underline": false}, {"text": "“Nós preparamos três opções de kits prontinhos, com carne, linguiça, asa de frango, pão de alho e carvão para você só escolher o tamanho da resenha.”", "bold": false, "italic": true, "underline": false}]}, {"type": "paragraph", "text": "Rafael: “O Kit Bronze custa cento e quarenta reais, é ideal para quatro a cinco pessoas e vem com um quilo de chã de dentro, um quilo de pernil, um quilo de linguiça, um quilo de asa de frango, um pacote de pão de alho e um saco de carvão.”", "style": "Normal", "runs": [{"text": "Rafael: ", "bold": true, "italic": false, "underline": false}, {"text": "“O Kit Bronze custa cento e quarenta reais, é ideal para quatro a cinco pessoas e vem com um quilo de chã de dentro, um quilo de pernil, um quilo de linguiça, um quilo de asa de frango, um pacote de pão de alho e um saco de carvão.”", "bold": false, "italic": true, "underline": false}]}, {"type": "paragraph", "text": "Rafael: “O Kit Prata custa cento e sessenta reais, atende de cinco a seis pessoas e vem com um quilo de alcatra, um quilo de pernil, um quilo de linguiça, quinhentos gramas de torresmo, um quilo de asa de frango, um pacote de pão de alho e um saco de carvão.”", "style": "Normal", "runs": [{"text": "Rafael: ", "bold": true, "italic": false, "underline": false}, {"text": "“O Kit Prata custa cento e sessenta reais, atende de cinco a seis pessoas e vem com um quilo de alcatra, um quilo de pernil, um quilo de linguiça, quinhentos gramas de torresmo, um quilo de asa de frango, um pacote de pão de alho e um saco de carvão.”", "bold": false, "italic": true, "underline": false}]}, {"type": "paragraph", "text": "Rafael: “E o Kit Ouro custa cento e oitenta reais, é ideal para seis a oito pessoas e vem com um quilo de contrafilé, um quilo de pernil, um quilo de linguiça, um quilo de torresmo, um quilo de asa de frango, um pacote de pão de alho e um saco de carvão.”", "style": "Normal", "runs": [{"text": "Rafael: ", "bold": true, "italic": false, "underline": false}, {"text": "“E o Kit Ouro custa cento e oitenta reais, é ideal para seis a oito pessoas e vem com um quilo de contrafilé, um quilo de pernil, um quilo de linguiça, um quilo de torresmo, um quilo de asa de frango, um pacote de pão de alho e um saco de carvão.”", "bold": false, "italic": true, "underline": false}]}, {"type": "paragraph", "text": "Rafael: “Você pode passar na loja e retirar ou pedir pelo nosso delivery. Na correria ou não, dá para garantir o churrasco do fim de semana sem complicação.”", "style": "Normal", "runs": [{"text": "Rafael: ", "bold": true, "italic": false, "underline": false}, {"text": "“Você pode passar na loja e retirar ou pedir pelo nosso delivery. Na correria ou não, dá para garantir o churrasco do fim de semana sem complicação.”", "bold": false, "italic": true, "underline": false}]}, {"type": "paragraph", "text": "Rafael: “Curtiu? Então marca aquela pessoa que não pode faltar nessa resenha e deixa que o churrasco o Caçulinha ajuda você a resolver.”", "style": "Normal", "runs": [{"text": "Rafael: ", "bold": true, "italic": false, "underline": false}, {"text": "“Curtiu? Então marca aquela pessoa que não pode faltar nessa resenha e deixa que o churrasco o Caçulinha ajuda você a resolver.”", "bold": false, "italic": true, "underline": false}]}, {"type": "paragraph", "text": "Resumo dos kits", "style": "Heading 2", "runs": [{"text": "Resumo dos kits", "bold": false, "italic": false, "underline": false}]}, {"type": "table", "rows": [["Kit", "Valor", "Pessoas", "Composição"], ["Bronze", "R$ 140", "4–5", "1 kg chã de dentro; 1 kg pernil; 1 kg linguiça; 1 kg asa; pão de alho; carvão."], ["Prata", "R$ 160", "5–6", "1 kg alcatra; 1 kg pernil; 1 kg linguiça; 500 g torresmo; 1 kg asa; pão de alho; carvão."], ["Ouro", "R$ 180", "6–8", "1 kg contrafilé; 1 kg pernil; 1 kg linguiça; 1 kg torresmo; 1 kg asa; pão de alho; carvão."]]}, {"type": "paragraph", "text": "Orientação de gravação", "style": "Heading 2", "runs": [{"text": "Orientação de gravação", "bold": false, "italic": false, "underline": false}]}, {"type": "paragraph", "text": "Deixar os três kits montados e identificados antes da fala.", "style": "List Bullet", "runs": [{"text": "Deixar os três kits montados e identificados antes da fala.", "bold": false, "italic": false, "underline": false}]}, {"type": "paragraph", "text": "Gravar primeiro a abertura e o encerramento; depois, apresentar cada kit separadamente.", "style": "List Bullet", "runs": [{"text": "Gravar primeiro a abertura e o encerramento; depois, apresentar cada kit separadamente.", "bold": false, "italic": false, "underline": false}]}, {"type": "paragraph", "text": "Ao falar cada composição, apontar para o kit correspondente.", "style": "List Bullet", "runs": [{"text": "Ao falar cada composição, apontar para o kit correspondente.", "bold": false, "italic": false, "underline": false}]}, {"type": "paragraph", "text": "Se a fala completa ficar longa, cada kit pode ser gravado em um bloco separado.", "style": "List Bullet", "runs": [{"text": "Se a fala completa ficar longa, cada kit pode ser gravado em um bloco separado.", "bold": false, "italic": false, "underline": false}]}, {"type": "paragraph", "text": "Takes específicos", "style": "Heading 2", "runs": [{"text": "Takes específicos", "bold": false, "italic": false, "underline": false}]}, {"type": "table", "rows": [["#", "Take necessário"], ["1", "Os três kits alinhados, com Rafael ao centro ou ao lado."], ["2", "Kit Bronze completo, visto de frente e em detalhe."], ["3", "Kit Prata completo, visto de frente e em detalhe."], ["4", "Kit Ouro completo, visto de frente e em detalhe."], ["5", "Mãos montando um kit com carnes, linguiça, asa, pão de alho e carvão."], ["6", "Kit sendo fechado, entregue no balcão ou colocado para retirada."], ["7", "Rafael segurando ou apresentando um dos kits para a câmera."]]}, {"type": "paragraph", "text": "ROTEIRO 07  •  CONTEÚDO DE CONVERSÃO", "style": "Normal", "runs": [{"text": "ROTEIRO 07  •  CONTEÚDO DE CONVERSÃO", "bold": true, "italic": false, "underline": false}]}, {"type": "paragraph", "text": "Como fazer um pedido pelo delivery", "style": "Heading 1", "runs": [{"text": "Como fazer um pedido pelo delivery", "bold": false, "italic": false, "underline": false}]}, {"type": "paragraph", "text": "Objetivo: Mostrar que pedir no Caçulinha é simples e direcionar o público para o link da bio.", "style": "Normal", "runs": [{"text": "Objetivo: ", "bold": true, "italic": false, "underline": false}, {"text": "Mostrar que pedir no Caçulinha é simples e direcionar o público para o link da bio.", "bold": false, "italic": false, "underline": false}]}, {"type": "paragraph", "text": "Participação: Rafael.", "style": "Normal", "runs": [{"text": "Participação: ", "bold": true, "italic": false, "underline": false}, {"text": "Rafael.", "bold": false, "italic": false, "underline": false}]}, {"type": "paragraph", "text": "Preparação: Abrir previamente o link da bio, conferir o canal correto e preparar um pedido demonstrativo sem dados reais de clientes.", "style": "Normal", "runs": [{"text": "Preparação: ", "bold": true, "italic": false, "underline": false}, {"text": "Abrir previamente o link da bio, conferir o canal correto e preparar um pedido demonstrativo sem dados reais de clientes.", "bold": false, "italic": false, "underline": false}]}, {"type": "paragraph", "text": "Roteiro falado", "style": "Heading 2", "runs": [{"text": "Roteiro falado", "bold": false, "italic": false, "underline": false}]}, {"type": "paragraph", "text": "Rafael: “Está sem tempo de passar na loja, mas precisa resolver as compras de casa? Você pode pedir no Caçulinha sem complicação.”", "style": "Normal", "runs": [{"text": "Rafael: ", "bold": true, "italic": false, "underline": false}, {"text": "“Está sem tempo de passar na loja, mas precisa resolver as compras de casa? Você pode pedir no Caçulinha sem complicação.”", "bold": false, "italic": true, "underline": false}]}, {"type": "paragraph", "text": "Rafael: “Primeiro, acesse o link que está na bio do nosso perfil e escolha a opção de atendimento pelo delivery.”", "style": "Normal", "runs": [{"text": "Rafael: ", "bold": true, "italic": false, "underline": false}, {"text": "“Primeiro, acesse o link que está na bio do nosso perfil e escolha a opção de atendimento pelo delivery.”", "bold": false, "italic": true, "underline": false}]}, {"type": "paragraph", "text": "Rafael: “Depois, envie sua lista ou informe os produtos e as quantidades que precisa. Nossa equipe confirma os itens disponíveis e orienta você durante o pedido.”", "style": "Normal", "runs": [{"text": "Rafael: ", "bold": true, "italic": false, "underline": false}, {"text": "“Depois, envie sua lista ou informe os produtos e as quantidades que precisa. Nossa equipe confirma os itens disponíveis e orienta você durante o pedido.”", "bold": false, "italic": true, "underline": false}]}, {"type": "paragraph", "text": "Rafael: “Confira com atenção os produtos, o endereço, a forma de pagamento e as informações da entrega antes de finalizar.”", "style": "Normal", "runs": [{"text": "Rafael: ", "bold": true, "italic": false, "underline": false}, {"text": "“Confira com atenção os produtos, o endereço, a forma de pagamento e as informações da entrega antes de finalizar.”", "bold": false, "italic": true, "underline": false}]}, {"type": "paragraph", "text": "Rafael: “Pronto! A nossa equipe separa seu pedido com todo cuidado e você recebe as compras sem precisar sair de casa.”", "style": "Normal", "runs": [{"text": "Rafael: ", "bold": true, "italic": false, "underline": false}, {"text": "“Pronto! A nossa equipe separa seu pedido com todo cuidado e você recebe as compras sem precisar sair de casa.”", "bold": false, "italic": true, "underline": false}]}, {"type": "paragraph", "text": "Rafael: “Precisou de carnes, hortifruti e praticidade? Peça pelo delivery no link da bio. No Caçulinha tem!”", "style": "Normal", "runs": [{"text": "Rafael: ", "bold": true, "italic": false, "underline": false}, {"text": "“Precisou de carnes, hortifruti e praticidade? Peça pelo delivery no link da bio. No Caçulinha tem!”", "bold": false, "italic": true, "underline": false}]}, {"type": "paragraph", "text": "Orientação de gravação", "style": "Heading 2", "runs": [{"text": "Orientação de gravação", "bold": false, "italic": false, "underline": false}]}, {"type": "paragraph", "text": "Usar um celular com tela limpa e brilho suficiente.", "style": "List Bullet", "runs": [{"text": "Usar um celular com tela limpa e brilho suficiente.", "bold": false, "italic": false, "underline": false}]}, {"type": "paragraph", "text": "Não mostrar nomes, endereços, telefones ou conversas de clientes reais.", "style": "List Bullet", "runs": [{"text": "Não mostrar nomes, endereços, telefones ou conversas de clientes reais.", "bold": false, "italic": false, "underline": false}]}, {"type": "paragraph", "text": "Demonstrar o fluxo que realmente está funcionando atualmente.", "style": "List Bullet", "runs": [{"text": "Demonstrar o fluxo que realmente está funcionando atualmente.", "bold": false, "italic": false, "underline": false}]}, {"type": "paragraph", "text": "Evitar prometer prazo, taxa ou área de entrega se essas informações variarem.", "style": "List Bullet", "runs": [{"text": "Evitar prometer prazo, taxa ou área de entrega se essas informações variarem.", "bold": false, "italic": false, "underline": false}]}, {"type": "paragraph", "text": "Gravar também a montagem de um pedido real ou demonstrativo dentro da loja.", "style": "List Bullet", "runs": [{"text": "Gravar também a montagem de um pedido real ou demonstrativo dentro da loja.", "bold": false, "italic": false, "underline": false}]}, {"type": "paragraph", "text": "Takes específicos", "style": "Heading 2", "runs": [{"text": "Takes específicos", "bold": false, "italic": false, "underline": false}]}, {"type": "table", "rows": [["#", "Take necessário"], ["1", "Rafael segurando o celular e falando para a câmera."], ["2", "Dedo acessando o link da bio."], ["3", "Tela abrindo o canal oficial do delivery, sem dados particulares."], ["4", "Equipe separando os itens de um pedido."], ["5", "Conferência de produtos e quantidades."], ["6", "Sacola sendo fechada e identificada."], ["7", "Pedido pronto no balcão ou sendo entregue para saída."]]}, {"type": "paragraph", "text": "ROTEIRO 08  •  CAPTAÇÃO DE APOIO", "style": "Normal", "runs": [{"text": "ROTEIRO 08  •  CAPTAÇÃO DE APOIO", "bold": true, "italic": false, "underline": false}]}, {"type": "paragraph", "text": "Banco de takes genéricos", "style": "Heading 1", "runs": [{"text": "Banco de takes genéricos", "bold": false, "italic": false, "underline": false}]}, {"type": "paragraph", "text": "Essas imagens podem ser usadas em diferentes Reels, anúncios, Stories e conteúdos narrados. Grave cada take por aproximadamente 5 a 8 segundos. Quando possível, faça uma versão   <script>
    (() => {
      'use strict';
      const data = JSON.parse(document.getElementById('documentData').textContent);
      const blocks = data.blocks;
      const content = document.getElementById('conteudo');
      const navList = document.getElementById('navList');
      const searchInput = document.getElementById('searchInput');
      const clearSearch = document.getElementById('clearSearch');
      const toast = document.getElementById('toast');
      const checkedKey = 'caculinha-gravacao-2026-10-06';
      let stored = {};
      try { stored = JSON.parse(localStorage.getItem(checkedKey) || '{}'); } catch (_) {}

      const normalize = text => text.normalize('NFD').replace(/[\u0300-\u036f]/g, '').toLowerCase();
      const slug = text => normalize(text).replace(/[^a-z0-9]+/g, '-').replace(/^-|-$/g, '');
      const el = (tag, className, text) => {
        const node = document.createElement(tag);
        if (className) node.className = className;
        if (text !== undefined) node.textContent = text;
        return node;
      };
      const addRichText = (target, block) => {
        if (!block.runs || !block.runs.length) { target.textContent = block.text; return; }
        block.runs.forEach(run => {
          let node = document.createTextNode(run.text);
          if (run.italic) { const wrap = document.createElement('em'); wrap.append(node); node = wrap; }
          if (run.bold) { const wrap = document.createElement('strong'); wrap.append(node); node = wrap; }
          if (run.underline) { const wrap = document.createElement('u'); wrap.append(node); node = wrap; }
          target.append(node);
        });
      };

      const firstScript = blocks.findIndex(b => b.type === 'paragraph' && /^ROTEIRO\s+01\b/.test(b.text));
      const finalStart = blocks.findIndex(b => b.type === 'paragraph' && b.text === 'Checklist de encerramento');
      const planStart = blocks.findIndex(b => b.type === 'paragraph' && b.text === 'Plano da gravação');
      const intro = blocks.slice(0, planStart);
      const sectionDefs = [{ id: 'plano-da-gravacao', label: 'Plano da gravação', kicker: 'Visão geral', number: '•', blocks: blocks.slice(planStart + 1, firstScript) }];
      const scriptStarts = [];
      blocks.forEach((b, i) => { if (b.type === 'paragraph' && /^ROTEIRO\s+\d+\b/.test(b.text)) scriptStarts.push(i); });
      scriptStarts.forEach((start, index) => {
        const end = index + 1 < scriptStarts.length ? scriptStarts[index + 1] : finalStart;
        const part = blocks.slice(start, end);
        const heading = part.find(b => b.type === 'paragraph' && b.style === 'Heading 1');
        const marker = part[0].text;
        const number = (marker.match(/ROTEIRO\s+(\d+)/) || [,''])[1];
        const bodyStart = part[1] === heading ? 2 : 1;
        sectionDefs.push({ id: `roteiro-${number}`, label: heading ? heading.text : marker, kicker: marker, number, blocks: part.slice(bodyStart) });
      });
      sectionDefs.push({ id: 'checklist-de-encerramento', label: 'Checklist de encerramento', kicker: 'Conferência final', number: '✓', blocks: blocks.slice(finalStart + 1) });

      const hero = el('section', 'hero'); hero.id = 'inicio';
      hero.append(el('span', 'eyebrow', 'Planejamento de conteúdo'));
      hero.append(el('h1', '', intro[0]?.text || 'Roteiros para gravação'));
      hero.append(el('div', 'subtitle', intro[1]?.text || ''));
      hero.append(el('p', 'intro', intro[2]?.text || ''));
      const stats = intro.find(b => b.type === 'table' && b.rows?.[0]?.length === 3);
      if (stats) {
        const metrics = el('div', 'metrics');
        stats.rows[0].forEach(cell => {
          const lines = cell.split('\n'); const card = el('div', 'metric');
          card.append(el('strong', '', lines.shift() || '')); card.append(el('span', '', lines.join(' '))); metrics.append(card);
        });
        hero.append(metrics);
      }
      const priority = intro.find(b => b.type === 'paragraph' && b.runs?.some(r => r.italic));
      if (priority) hero.append(el('p', 'priority-note', priority.text));
      content.append(hero);

      function createCheckItem(text, key, number = '') {
        const label = el('label', 'check-item');
        const input = document.createElement('input'); input.type = 'checkbox'; input.dataset.key = key; input.checked = !!stored[key];
        if (number) label.append(el('span', 'check-number', number));
        label.append(input, el('span', '', text.replace(/^☐\s*/, '')));
        input.addEventListener('change', () => { stored[key] = input.checked; localStorage.setItem(checkedKey, JSON.stringify(stored)); updateProgress(); });
        return label;
      }

      function renderTable(block, sectionId, tableIndex) {
        const rows = block.rows || [];
        if (rows.length === 1 && rows[0].length === 1) {
          const lines = rows[0][0].split('\n'); const box = el('div', 'callout');
          if (lines.length > 1) { box.append(el('strong', '', lines.shift())); box.append(document.createTextNode(lines.join('\n'))); }
          else box.textContent = rows[0][0];
          return box;
        }
        const headers = rows[0] || [];
        if (headers.length === 2 && /^#/.test(headers[0]) && /take/i.test(headers[1])) {
          const list = el('div', 'take-list');
          list.append(el('span', 'sr-only', headers[1]));
          rows.slice(1).forEach((row, i) => list.append(createCheckItem(row[1], `${sectionId}-table-${tableIndex}-${i}`, row[0])));
          return list;
        }
        const wrap = el('div', 'table-wrap'); const table = document.createElement('table');
        const thead = document.createElement('thead'); const hr = document.createElement('tr');
        headers.forEach(cell => hr.append(el('th', '', cell))); thead.append(hr); table.append(thead);
        const tbody = document.createElement('tbody');
        rows.slice(1).forEach(row => { const tr = document.createElement('tr'); row.forEach(cell => tr.append(el('td', '', cell))); tbody.append(tr); });
        table.append(tbody); wrap.append(table); return wrap;
      }

      function renderBlocks(target, section) {
        let list = null; let listType = ''; let tableIndex = 0; let checkIndex = 0;
        const closeList = () => { list = null; listType = ''; };
        section.blocks.forEach(block => {
          if (block.type === 'table') { closeList(); target.append(renderTable(block, section.id, tableIndex++)); return; }
          const style = block.style || '';
          if (style === 'Heading 1') { closeList(); target.append(el('h3', '', block.text)); return; }
          if (style === 'Heading 2') { closeList(); target.append(el('h3', '', block.text)); return; }
          if (/^List (Bullet|Number)/.test(style)) {
            const type = /Number/.test(style) ? 'ol' : 'ul';
            if (!list || listType !== type) { list = document.createElement(type); listType = type; target.append(list); }
            list.append(el('li', '', block.text)); return;
          }
          closeList();
          if (/^☐/.test(block.text)) { target.append(createCheckItem(block.text, `${section.id}-check-${checkIndex++}`)); return; }
          const p = el('p'); addRichText(p, block);
          if (/^(Rafael|Tarlis|Açougueiro|Rafael ou Tarlis|Tarlis ou Rafael):/.test(block.text) && block.runs?.some(r => r.italic)) p.className = 'spoken';
          else if (/^(Objetivo|Participação|Tom|Local de gravação|Formato):/.test(block.text)) p.className = 'detail-line';
          target.append(p);
        });
      }

      sectionDefs.forEach(section => {
        const card = el('article', 'section-card'); card.id = section.id;
        card.dataset.search = normalize(section.label + ' ' + section.kicker + ' ' + section.blocks.map(b => b.text || (b.rows || []).flat().join(' ')).join(' '));
        const head = el('div', 'section-heading'); const titleWrap = el('div');
        titleWrap.append(el('span', 'section-kicker', section.kicker), el('h2', '', section.label)); head.append(titleWrap);
        if (/^roteiro-/.test(section.id)) {
          const copy = el('button', 'copy-button'); copy.type = 'button';
          copy.innerHTML = '<svg viewBox="0 0 24 24" fill="none" aria-hidden="true"><rect x="8" y="8" width="11" height="11" rx="2" stroke="currentColor" stroke-width="2"/><path d="M16 8V6a2 2 0 0 0-2-2H6a2 2 0 0 0-2 2v8a2 2 0 0 0 2 2h2" stroke="currentColor" stroke-width="2"/></svg><span>Copiar roteiro</span>';
          copy.addEventListener('click', async () => {
            const text = `${section.kicker}\n${section.label}\n\n${section.blocks.map(b => b.text || (b.rows || []).map(r => r.join(' — ')).join('\n')).join('\n')}`;
            try { await navigator.clipboard.writeText(text); showToast('Roteiro copiado'); }
            catch (_) { showToast('Não foi possível copiar automaticamente'); }
          }); head.append(copy);
        }
        card.append(head); const body = el('div', 'section-body'); renderBlocks(body, section); card.append(body); content.append(card);
      });

      const empty = el('div', 'empty-state', 'Nenhum trecho corresponde à sua busca.'); empty.id = 'emptyState'; content.append(empty);
      const navItems = [{ id: 'inicio', label: 'Início', number: '⌂' }, ...sectionDefs.map(s => ({ id: s.id, label: s.label, number: s.number }))];
      navItems.forEach(item => { const li = document.createElement('li'); const link = document.createElement('a'); link.href = `#${item.id}`; link.append(el('span', 'nav-number', item.number), el('span', '', item.label)); li.append(link); navList.append(li); link.addEventListener('click', closeNav); });

      function showToast(message) { toast.textContent = message; toast.classList.add('visible'); clearTimeout(showToast.timer); showToast.timer = setTimeout(() => toast.classList.remove('visible'), 1800); }
      function updateProgress() {
        const checks = [...document.querySelectorAll('.check-item input')]; const done = checks.filter(c => c.checked).length;
        document.getElementById('progressText').textContent = `${done} de ${checks.length}`;
        document.getElementById('progressFill').style.width = checks.length ? `${done / checks.length * 100}%` : '0%';
      }
      function filterContent() {
        const term = normalize(searchInput.value.trim()); let visible = 0;
        document.querySelectorAll('.section-card').forEach(card => { const show = !term || card.dataset.search.includes(term); card.hidden = !show; if (show) visible++; });
        document.getElementById('inicio').hidden = !!term;
        document.getElementById('emptyState').classList.toggle('visible', !!term && visible === 0);
        clearSearch.style.display = term ? 'block' : 'none';
      }
      function closeNav() { document.body.classList.remove('nav-open'); document.getElementById('menuButton').setAttribute('aria-expanded', 'false'); }
      searchInput.addEventListener('input', filterContent);
      clearSearch.addEventListener('click', () => { searchInput.value = ''; filterContent(); searchInput.focus(); });
      document.getElementById('printButton').addEventListener('click', () => window.print());
      document.getElementById('menuButton').addEventListener('click', () => { const open = document.body.classList.toggle('nav-open'); document.getElementById('menuButton').setAttribute('aria-expanded', String(open)); });
      document.getElementById('backdrop').addEventListener('click', closeNav);
      document.getElementById('backTop').addEventListener('click', () => window.scrollTo({ top: 0, behavior: 'smooth' }));
      window.addEventListener('scroll', () => document.getElementById('backTop').classList.toggle('visible', window.scrollY > 500), { passive: true });
      const observer = new IntersectionObserver(entries => {
        entries.filter(e => e.isIntersecting).sort((a,b) => b.intersectionRatio - a.intersectionRatio).slice(0,1).forEach(entry => {
          document.querySelectorAll('.nav-list a').forEach(a => a.classList.toggle('active', a.getAttribute('href') === `#${entry.target.id}`));
        });
      }, { rootMargin: '-20% 0px -70% 0px', threshold: [0, .2, .5] });
      document.querySelectorAll('#inicio, .section-card').forEach(section => observer.observe(section));
      updateProgress();
    })();
  </script>
